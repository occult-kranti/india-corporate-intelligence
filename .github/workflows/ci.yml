name: CI

on:
  # A branch with an open PR fires `pull_request`; the default branch fires
  # `push`. Listening for pushes on every branch as well meant each PR commit ran
  # the whole suite twice, for an identical result.
  push:
    branches: [master]
  pull_request:

# Supersede in-flight runs for the same branch. The suite installs a browser and
# renders 21 routes, so a run made obsolete by the next push is worth cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Extraction → resolution → grounding → assembly over research/raw.
      # Fails only on a record that would violate the provenance invariant;
      # weakly-identified entities are quarantined, which is the gate working.
      - name: Promote research quarantine
        run: npm run promote

      # Research fleets → src/graph/energy.generated.ts, src/data/welfare.generated.ts.
      # Reconciliation and audit verdicts are applied, then the four invariants are
      # checked over what survives; a violation fails here and writes nothing. With
      # no fleet research present it emits empty modules, so the build never waits
      # on research. Here it overwrites whatever was committed, so the site is built
      # from the research as it stands; validate's stale-module check is for local runs.
      - name: Assemble research fleets
        run: npm run generate

      # The assembler's own rules (reconcile, audit, the four invariants, per-fleet
      # writes) and the graph merge, tested on a synthetic fixture. Research-independent,
      # so a red here is a code fault, never a data one.
      - name: Assembler and merge tests
        run: npm run test:assemble

      # The /security data layer's named derivations (shares, brackets, the slice's
      # one-buyer figure, state-record filing) against a fixture: the page's
      # components only format, so a wrong figure is caught here before any render.
      - name: Security derivation tests
        run: npm run test:security-view

      # The four invariants. This is what makes them true by construction rather
      # than by author care: every edge carries sources or is tier alleged/analytic,
      # every analytic edge carries an innocent reading, no unresolved entity holds
      # an edge, every superseded fact stays addressable, every motif census has a
      # denominator.
      - name: Data integrity
        run: npm run validate

      # The force-money-trail skill is generated from the raw files and FORCE_META
      # (scripts/skills/force-money-trail/gen.mjs): no figure in it is typed by hand.
      # Regenerate it and fail if the committed copy differs, so a research change
      # cannot leave the skill quoting figures the files no longer hold.
      - name: Skill freshness
        run: npm run check:skills

      - name: Typecheck and build
        run: npm run build

      - name: Install Chromium for the render smoke test
        run: npx playwright install --with-deps chromium

      # The smoke test serves dist itself, so there is no preview server to start,
      # wait on, or have reaped out from under it.
      - name: Headless render smoke test
        run: npm run smoke

      # Measures the graph camera: no silent letterbox, a 200px drag moves the
      # graph 200px, auto-fit clips nothing, maximise really hands over the
      # window. Every check exists because that bug shipped past the other four
      # gates — none of them is a type error, and smoke passes happily while the
      # graph is unusable.
      - name: Graph viewport gate
        run: npm run viewport

      # The page acceptance suites: /energy (67 criteria), /welfare (85, of which
      # the 9 scaffold criteria skip here because they need an empty build) and the
      # national section of /tenders (86; 2 skip as "not in this data") and /finance
      # (110; AC-38 skips while no zero-amount loan exists) and /security (152, plus
      # the §0.6 keyed-hooks check: 153 tests, none skipped, since the suite builds
      # its own empty and zero-series scaffolds). Each
      # criterion was written against the judged spec before the page existed, so a
      # regression here is a spec violation, not a flaky pixel. Files are named
      # explicitly: Node 20's --test does not expand a glob.
      - name: Page acceptance suites
        run: npm run test:pages
