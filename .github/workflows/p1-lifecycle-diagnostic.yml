          retention-days: 14
      - name: Partition complete candidate evidence
        id: candidate_parts
        if: always() && steps.prepare.outcome == 'success'
        working-directory: pinned-candidate/spatial-prototype
        run: node scripts/partition-browser-artifacts.mjs
      - name: Preserve candidate evidence part 01
