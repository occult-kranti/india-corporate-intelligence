name: Spatial release integration review

on:
  pull_request:
    paths:
      - "spatial-prototype/**"
      - "src/**"
      - "public/**"
      - "research/**"
      - "global-evidence-workbench/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "scripts/build-global-workbench.mjs"
      - "scripts/spatial-release*.mjs"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/spatial-release-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spatial-release-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  combined-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      SPATIAL_RELEASE_REVIEW: github-actions
      SPATIAL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the review revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            global-evidence-workbench/ui/package-lock.json
            spatial-prototype/package-lock.json
      - name: Install original root, global workbench and spatial dependencies
        run: |
          npm ci
          npm ci --prefix global-evidence-workbench/ui
          npm ci --prefix spatial-prototype
      - name: Verify original source pins and immutable reviewed registry
        run: node scripts/spatial-release-validate.mjs --preflight
      - name: Test release integration guards
        run: node --test scripts/spatial-release-validate.test.mjs scripts/spatial-release.browser.test.mjs
      - name: Check exact committed original registry before any promotion
        working-directory: spatial-prototype
        env:
          FIELDWORK_SOURCE_ROOT: ${{ github.workspace }}
        run: npm test
      - name: Check preserved global workbench provenance and integration
        run: npm run test:global-workbench
      - name: Build original root and global workbench without data regeneration
        run: npm run build
      - name: Build the reviewed spatial snapshot without regeneration
        working-directory: spatial-prototype
        run: npm run build
      - name: Add spatial output without replacing original output files
        run: node scripts/spatial-release-validate.mjs --copy
      - name: Install Chromium in GitHub CI only
        run: npx --no-install playwright install --with-deps chromium
      - name: Review actual combined navigation and source-route round trips
        run: node scripts/spatial-release.browser.mjs
      - name: Publish review summary
        if: always()
        run: |
          if [ -f spatial-release-review/summary.md ]; then
            cat spatial-release-review/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Combined spatial review did not complete. Inspect the failing build or provenance gate.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve combined-path screenshots and provenance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-release-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: spatial-release-review/
          if-no-files-found: warn
          retention-days: 14
