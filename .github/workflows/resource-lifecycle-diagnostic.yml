        run: git diff --exit-code -- spatial-prototype/src spatial-prototype/public spatial-prototype/package.json spatial-prototype/package-lock.json spatial-prototype/vite.config.ts spatial-prototype/tsconfig.json
      - name: Partition candidate evidence into separately bounded artifacts
        id: candidate_parts
        if: always() && steps.harness.outcome == 'success'
        working-directory: pinned-candidate/spatial-prototype
        run: node scripts/partition-browser-artifacts.mjs
      - name: Preserve candidate evidence part 01
        if: always() && steps.candidate_parts.outcome == 'success' && steps.candidate_parts.outputs.part_01 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resource-lifecycle-candidate-${{ github.run_id }}-${{ github.run_attempt }}-part-01
          path: pinned-candidate/spatial-prototype/browser-artifact-parts/01/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Preserve candidate evidence part 02
        if: always() && steps.candidate_parts.outcome == 'success' && steps.candidate_parts.outputs.part_02 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resource-lifecycle-candidate-${{ github.run_id }}-${{ github.run_attempt }}-part-02
          path: pinned-candidate/spatial-prototype/browser-artifact-parts/02/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Preserve candidate evidence part 03
        if: always() && steps.candidate_parts.outcome == 'success' && steps.candidate_parts.outputs.part_03 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resource-lifecycle-candidate-${{ github.run_id }}-${{ github.run_attempt }}-part-03
          path: pinned-candidate/spatial-prototype/browser-artifact-parts/03/
