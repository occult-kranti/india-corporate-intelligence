          retention-days: 14
      - name: Preserve candidate evidence part 06
        if: always() && steps.candidate_parts.outcome == 'success' && steps.candidate_parts.outputs.part_06 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resource-lifecycle-candidate-${{ github.run_id }}-${{ github.run_attempt }}-part-06
          path: pinned-candidate/spatial-prototype/browser-artifact-parts/06/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Preserve candidate evidence part 07
        if: always() && steps.candidate_parts.outcome == 'success' && steps.candidate_parts.outputs.part_07 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resource-lifecycle-candidate-${{ github.run_id }}-${{ github.run_attempt }}-part-07
          path: pinned-candidate/spatial-prototype/browser-artifact-parts/07/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Preserve candidate evidence part 08
        if: always() && steps.candidate_parts.outcome == 'success' && steps.candidate_parts.outputs.part_08 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resource-lifecycle-candidate-${{ github.run_id }}-${{ github.run_attempt }}-part-08
          path: pinned-candidate/spatial-prototype/browser-artifact-parts/08/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Publish separate diagnostic outcomes without acceptance claims
        if: always()
        env:
          BASELINE_OUTCOME: ${{ steps.baseline_profile.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate_profile.outcome }}
        run: |
          echo 'Scenario 46 CPU attribution only. Neither outcome establishes full-suite acceptance or resolves the full-suite timeout.' >> "$GITHUB_STEP_SUMMARY"
          printf 'Baseline step: %s; frozen candidate step: %s\n' "$BASELINE_OUTCOME" "$CANDIDATE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo 'Both use the same copied harness, 1000 µs Node/CDP CPU sampling, unchanged native observation, full trace, and the original 300-second scenario budget. Sequential order, load and instrumentation are confounders.' >> "$GITHUB_STEP_SUMMARY"
          for role in baseline candidate; do
            summary="pinned-$role/spatial-prototype/browser-review/resource-lifecycle-diagnostic/summary.md"
            if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
          done
# Independent read-only diagnostics. Existing full/default, early smoke, release,
# CI and deployment workflows remain untouched and mandatory for acceptance.
