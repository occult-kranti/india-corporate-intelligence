      - name: Preserve candidate evidence part 04
        if: always() && steps.candidate_parts.outcome == 'success' && steps.candidate_parts.outputs.part_04 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resource-lifecycle-candidate-${{ github.run_id }}-${{ github.run_attempt }}-part-04
          path: pinned-candidate/spatial-prototype/browser-artifact-parts/04/
          if-no-files-found: error
          include-hidden-files: true
