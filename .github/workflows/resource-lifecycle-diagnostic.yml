      - name: Preserve baseline evidence part 06
        if: always() && steps.baseline_parts.outcome == 'success' && steps.baseline_parts.outputs.part_06 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resource-lifecycle-baseline-${{ github.run_id }}-${{ github.run_attempt }}-part-06
          path: pinned-baseline/spatial-prototype/browser-artifact-parts/06/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Preserve baseline evidence part 07
        if: always() && steps.baseline_parts.outcome == 'success' && steps.baseline_parts.outputs.part_07 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resource-lifecycle-baseline-${{ github.run_id }}-${{ github.run_attempt }}-part-07
          path: pinned-baseline/spatial-prototype/browser-artifact-parts/07/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Preserve baseline evidence part 08
        if: always() && steps.baseline_parts.outcome == 'success' && steps.baseline_parts.outputs.part_08 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resource-lifecycle-baseline-${{ github.run_id }}-${{ github.run_attempt }}-part-08
          path: pinned-baseline/spatial-prototype/browser-artifact-parts/08/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Install and build pinned candidate with standard commands
        id: candidate_build
        if: always() && steps.harness.outcome == 'success'
        working-directory: pinned-candidate/spatial-prototype
        run: |
          mkdir -p browser-review/resource-lifecycle-diagnostic
          npm ci 2>&1 | tee browser-review/resource-lifecycle-diagnostic/install.log
          npm run build 2>&1 | tee browser-review/resource-lifecycle-diagnostic/build.log
          npx --no-install playwright install --with-deps chromium
      - name: Profile unchanged scenario 46 on pinned candidate
        id: candidate_profile
        if: always() && steps.candidate_build.outcome == 'success'
        timeout-minutes: 9
        working-directory: pinned-candidate/spatial-prototype
        env:
          SPATIAL_HEAD_SHA: 6ea92299d21ac5ab92686b714420d363de08fa99
          SPATIAL_RUNTIME_ROLE: candidate
        run: |
          test "$(git rev-parse HEAD)" = "$SPATIAL_HEAD_SHA"
          node scripts/resource-lifecycle-environment.mjs before
          set +e
          node --cpu-prof --cpu-prof-interval=1000 --cpu-prof-dir=browser-review/resource-lifecycle-diagnostic --cpu-prof-name=driver.cpuprofile scripts/browser-review.mjs --resource-lifecycle-diagnostic 2>&1 | tee browser-review/resource-lifecycle-diagnostic/browser-run.log
          pipeline=( "${PIPESTATUS[@]}" )
          status="${pipeline[0]}"
          set -e
