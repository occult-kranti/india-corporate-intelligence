      - name: Preserve candidate evidence part 05
        if: always() && steps.candidate_parts.outcome == 'success' && steps.candidate_parts.outputs.part_05 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resource-lifecycle-candidate-${{ github.run_id }}-${{ github.run_attempt }}-part-05
          path: pinned-candidate/spatial-prototype/browser-artifact-parts/05/
          if-no-files-found: error
