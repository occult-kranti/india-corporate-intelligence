name: Deploy

on:
  push:
    branches: [master]
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

# Never let two deploys race for the same branch. A superseded deploy is wasted
# work, but a half-finished one that wins the race is a broken site.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the built site to gh-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The site is only worth publishing if it passes the same gates CI runs.
      # Deploying past a red build would put unsourced or unrenderable content
      # live, which is the one failure this project cannot absorb.
      - name: Promote research quarantine
        run: npm run promote

      # Research fleets → src/graph/energy.generated.ts, src/data/welfare.generated.ts.
      # Reconciliation and audit verdicts are applied, then the four invariants are
      # checked over what survives; a violation fails here and writes nothing. With
      # no fleet research present it emits empty modules, so the build never waits
      # on research. Here it overwrites whatever was committed, so the site is built
      # from the research as it stands; validate's stale-module check is for local runs.
      - name: Assemble research fleets
        run: npm run generate

      # The assembler's own rules (reconcile, audit, the four invariants, per-fleet
      # writes) and the graph merge, tested on a synthetic fixture. Research-independent,
      # so a red here is a code fault, never a data one.
      - name: Assembler and merge tests
        run: npm run test:assemble

      - name: Data integrity
        run: npm run validate

      - name: Education provenance and comparison guards
        run: npm run validate:education && npm run test:education

      - name: Local model artifact integrity (no model download)
        run: npm run test:education:model

      - name: Water and food provenance, dates and indicator guards
        run: npm run validate:water && npm run test:water && npm run test:water:model

      - name: Public works provenance, comparisons, connections and local model
        run: npm run validate:public-works && npm run test:public-works && npm run test:public-works:model

      - name: Investigation provenance, graph, casebook and local model
        run: npm run validate:investigation && npm run test:investigation && npm run test:investigation:model

      # The immutable before/after guards read this exact historical commit.
      # Default checkout is shallow; fetch only the required baseline tree.
      - name: Fetch pinned procurement comparison baseline
        run: git fetch --no-tags --depth=1 origin 11a78e22a9998796c3c90b31fc4b708e98196c9c

      - name: Procurement provenance, cohort freshness and audit invariants
        run: npm run test:procurement

      - name: Follow-the-money cases, official universe and model provenance
        run: npm run validate:deep-investigation && npm run test:deep-investigation && npm run test:deep-investigation:model

      - name: Typecheck and build
        run: npm run build

      - name: Install Chromium for the render smoke test
        run: npx playwright install --with-deps chromium

      - name: Headless render smoke test
        run: npm run smoke

      - name: Education research workflow
        run: npm run test:education:browser

      - name: Water and food research workflow
        run: npm run test:water:browser

      # Includes retained sector workflow and shared-context history regressions.
      - name: Public works research workflow
        run: npm run test:public-works:browser

      - name: Dossier browser-history regression
        run: npm run test:dossier:history

      # New workspace workflows admitted after three consecutive stable runs.
      - name: Geographic investigation, paths and casebook workflows
        run: npm run test:investigation:browser

      - name: Follow-the-money map, response and export workflow
        run: npm run test:deep-investigation:browser

      - name: Source-backed procurement trail workflow
        run: npm run test:procurement:browser

      # Measures the graph camera: no silent letterbox, a 200px drag moves the
      # graph 200px, auto-fit clips nothing, maximise really hands over the
      # window. Every check exists because that bug shipped past the other four
      # gates — none of them is a type error, and smoke passes happily while the
      # graph is unusable.
      - name: Graph viewport gate
        run: npm run viewport

      # Publishing by pushing the build to `gh-pages`, rather than via the
      # actions/deploy-pages artifact flow, because Pages on this repository is
      # already configured to serve that branch. The artifact flow would need the
      # Pages source switched to "GitHub Actions" in repository settings first,
      # and a deploy that silently does nothing is worse than one extra branch.
      #
      # .nojekyll stops Jekyll from swallowing paths that begin with an
      # underscore. The build does not currently emit any, but it costs one line
      # and the failure mode is a silently missing asset.
      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          # Read the subject from git rather than interpolating the event payload,
          # so a multi-line or quote-bearing commit message cannot reshape this script.
          SUBJECT="$(git log -1 --pretty=%s)"
          touch dist/.nojekyll
          cd dist
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}: ${SUBJECT}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Where it landed
        run: |
          echo "Deployed ${GITHUB_SHA::7} to gh-pages."
          echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
