      - name: Require both diagnostic contracts without claiming release acceptance
        if: always()
        env:
          CONTROL: ${{ steps.control_run.outcome }}
          CANDIDATE: ${{ steps.candidate_run.outcome }}
        run: |
          test "$CONTROL" = success
          test "$CANDIDATE" = success
          printf '%s\n' 'Focused diagnostic only. Original, native zoom, full spatial and combined exact-head release gates remain mandatory.' >> "$GITHUB_STEP_SUMMARY"

